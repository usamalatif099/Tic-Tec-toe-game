<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <!-- media queary link   -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Teo</title>
</head>

<body>
    <nav>
        <ul>
            <li>Tic-Tac-teo</li>
        </ul>
    </nav>
    <div class="gamecontainer">
        <div class="container">
            <div class="line"></div>
            <div class="box bt-0 bl-0"><span class="boxtext" bt-0 .bl-0></span></div>
            <div class="box  bt-0"><span class="boxtext"></span></div>
            <div class="box  bt-0 br-0"><span class="boxtext"></span></div>
            <div class="box bl-0"><span class="boxtext"></span></div>
            <div class="box "><span class="boxtext"></span></div>
            <div class="box br-0"><span class="boxtext"></span></div>
            <div class="box bl-0 bb-0"><span class="boxtext"></span></div>
            <div class="box bb-0"><span class="boxtext"></span></div>
            <div class="box bb-0 br-0"><span class="boxtext"></span></div>
        </div>

        <div class="gameinfo">
            <h1>Welcome to Tic Tak Teo</h1>
            <div><span class="info" style="font-size: 25px;"> Turn for</span></div>
            <button id="reset">Reset</button>
            <div class="imgbox">
                <img id="imgwin" src="game-win.gif" alt="image">
            </div>
        </div>

    </div>





    <script src="script.js">    </script>
</body>

</html>
